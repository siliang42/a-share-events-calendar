<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ed1b2f">
    <title>A-Share Events Calendar | Source-Backed Market Catalyst Calendar</title>
    <meta name="description" content="An open-source calendar of officially announced policy, macro, industry, and company events relevant to A-share research.">
    <link rel="canonical" href="https://siliang42.github.io/a-share-events-calendar/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://siliang42.github.io/a-share-events-calendar/">
    <meta property="og:title" content="A-Share Events Calendar | Source-Backed Market Catalyst Calendar">
    <meta property="og:description" content="An open-source calendar of officially announced policy, macro, industry, and company events relevant to A-share research.">
    <meta property="og:image" content="https://siliang42.github.io/a-share-events-calendar/assets/preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="A-Share Events Calendar | Source-Backed Market Catalyst Calendar">
    <meta name="twitter:description" content="An open-source calendar of officially announced policy, macro, industry, and company events relevant to A-share research.">
    <meta name="twitter:image" content="https://siliang42.github.io/a-share-events-calendar/assets/preview.png">
    <meta name="twitter:image:alt" content="A-Share Events Calendar showing the September 15, 2026 event detail">
    <script id="webapplication-jsonld" type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "WebApplication",
                    "@id": "https://siliang42.github.io/a-share-events-calendar/#application",
                    "name": "A-Share Events Calendar",
                    "alternateName": "A 股事件驱动研究日历",
                    "description": "An open-source calendar of officially announced policy, macro, industry, and company events relevant to A-share research.",
                    "url": "https://siliang42.github.io/a-share-events-calendar/",
                    "applicationCategory": "FinanceApplication",
                    "operatingSystem": "Any",
                    "license": "https://opensource.org/license/mit",
                    "sameAs": ["https://github.com/siliang42/a-share-events-calendar"],
                    "isBasedOn": {
                        "@id": "https://github.com/siliang42/a-share-events-calendar#source-code"
                    }
                },
                {
                    "@type": "SoftwareSourceCode",
                    "@id": "https://github.com/siliang42/a-share-events-calendar#source-code",
                    "name": "A-Share Events Calendar source code",
                    "url": "https://github.com/siliang42/a-share-events-calendar",
                    "codeRepository": "https://github.com/siliang42/a-share-events-calendar",
                    "license": "https://opensource.org/license/mit",
                    "programmingLanguage": ["HTML", "CSS", "JavaScript"]
                }
            ]
        }
    </script>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand-lockup">
                <span class="brand-mark" aria-hidden="true"><i class="calendar-glyph"></i></span>
                <div class="identity">
                    <p class="identity-kicker">A-Share Events Calendar</p>
                    <h1>A 股事件驱动研究日历</h1>
                </div>
            </div>
            <button class="button button-primary" id="go-today" type="button">回到今天</button>
        </header>

        <main>
            <section class="calendar-section" aria-labelledby="calendar-heading">
                <div class="calendar-toolbar">
                    <div class="month-navigation">
                        <button class="button button-quiet month-control" id="prev-month" type="button" aria-label="查看上个月">‹</button>
                        <button class="button button-quiet month-control" id="next-month" type="button" aria-label="查看下个月">›</button>
                    </div>
                    <div class="month-heading">
                        <p class="month-caption">MONTHLY EVENT REGISTER</p>
                        <h2 id="calendar-heading"><span id="month-title">当前月份</span></h2>
                    </div>
                    <div class="calendar-stats" aria-label="本月统计">
                        <span id="event-count">事件日期 0 天</span>
                        <span id="holiday-count">法定假期 0 天</span>
                    </div>
                </div>

                <p class="sr-only" id="month-live" aria-live="polite" aria-atomic="true"></p>
                <div class="calendar-panel">
                    <div class="calendar-grid" id="calendar-grid" aria-labelledby="calendar-heading"></div>

                    <div class="calendar-legend" aria-label="日历图例">
                        <span><i class="legend-mark event-mark" aria-hidden="true"></i>已核验事件</span>
                        <span><i class="legend-mark today-mark" aria-hidden="true"></i>今天</span>
                        <span><i class="legend-mark holiday-mark" aria-hidden="true"></i>法定假期</span>
                        <span><i class="legend-mark workday-mark" aria-hidden="true"></i>调休上班</span>
                    </div>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>事件信息来自公开官方来源，仅供研究参考，不构成投资建议。</p>
            <p>数据记录：<span class="utility-text">js/data.js</span></p>
        </footer>
    </div>

    <div class="dialog-backdrop" id="dialog-backdrop" hidden></div>
    <aside class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
        <div class="detail-header">
            <div>
                <p class="detail-kicker" id="detail-date-key"></p>
                <h2 id="detail-title">日期详情</h2>
            </div>
            <button class="icon-button" id="detail-close" type="button" aria-label="关闭日期详情">关闭</button>
        </div>
        <div class="date-context" id="date-context"></div>
        <section class="events-section" aria-labelledby="events-title">
            <div class="events-heading-row">
                <h3 id="events-title">已核验事件</h3>
                <span class="events-total" id="detail-event-count">0 项</span>
            </div>
            <ol class="event-list" id="event-list"></ol>
            <p class="empty-state" id="event-empty" hidden>该日期暂无已核验事件。</p>
        </section>
    </aside>

    <script src="js/lunar.js"></script>
    <script src="js/data.js"></script>
    <script src="js/event-utils.js"></script>
    <script id="event-jsonld" type="application/ld+json"></script>
    <script src="js/app.js"></script>
</body>
</html>
