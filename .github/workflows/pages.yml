name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm run check
      - name: Assemble Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/css _site/js
          cp index.html .nojekyll robots.txt sitemap.xml llms.txt _site/
          cp -R css/. _site/css/
          cp -R js/. _site/js/
          if [ -d assets ]; then
            cp -R assets _site/assets
          fi
      - name: Verify Pages artifact
        run: |
          test -f _site/index.html
          test -f _site/.nojekyll
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/llms.txt
          test -d _site/css
          test -d _site/js
          for excluded in .git .github docs scripts test tests package.json package-lock.json npm-shrinkwrap.json README.md README.zh-CN.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md CITATION.cff; do
            test ! -e "_site/$excluded"
          done
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
